<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON PORTAL GACHA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgm" loop>
        <source src="https://me2uuuu.github.io/neon-portal/audio/neon_gacha_bgm.mp3" type="audio/mp3">
    </audio>

    <button id="sound-btn">🔊 사운드 ON</button>

    <div class="container">
        <h1>네온 포탈 가챠</h1>
        
        <div class="card-container">
            <div class="card" id="card1">✨ Gacha Card ✨</div>
            <div class="card" id="card2">✨ Gacha Card ✨</div>
            <div class="card" id="card3">✨ Gacha Card ✨</div>
        </div>

        <p id="score">점수: 0</p>
    </div>

    <script>
        const cardImages = [
            { img: "https://me2uuuu.github.io/neon-portal/docs/fire-cat.png", points: 100 },
            { img: "https://me2uuuu.github.io/neon-portal/docs/wind-cat.png", points: 80 },
            { img: "https://me2uuuu.github.io/neon-portal/docs/ice-cat.png", points: 60 },
            { img: "https://me2uuuu.github.io/neon-portal/docs/dark-neon-cat.png", points: 50 },
            { img: "https://me2uuuu.github.io/neon-portal/docs/thunder-cat.png", points: 70 },
            { img: "https://me2uuuu.github.io/neon-portal/docs/cyber-cat.png", points: 90 }
        ];

        let score = 0;
        const scoreDisplay = document.getElementById("score");

        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", function() {
                const randomIndex = Math.floor(Math.random() * cardImages.length);
                const selectedCard = cardImages[randomIndex];

                this.innerHTML = `<img src="${selectedCard.img}" alt="Gacha Card">`;

                score += selectedCard.points;
                scoreDisplay.innerText = `점수: ${score}`;
            });
        });

        const bgm = document.getElementById("bgm");
        const soundBtn = document.getElementById("sound-btn");

        soundBtn.addEventListener("click", function() {
            bgm.play();
            soundBtn.style.display = "none";
        });
    </script>
</body>
</html>
