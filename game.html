<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Chase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="score">점수: 0</p>
    <img id="neon-cat" src="images/neoncat.gif" onclick="clickCat()">
    
    <audio autoplay loop>
        <source src="audio/neon_singularity_bgm.mp3" type="audio/mp3">
    </audio>

    <script>
        let score = 0;
        const cat = document.getElementById("neon-cat");
        const scoreDisplay = document.getElementById("score");

        function moveCat() {
            const maxX = window.innerWidth - 150;
            const maxY = window.innerHeight - 150;
            const newX = Math.floor(Math.random() * maxX);
            const newY = Math.floor(Math.random() * maxY);
            cat.style.left = newX + "px";
            cat.style.top = newY + "px";
        }

        function clickCat() {
            score++;
            scoreDisplay.innerHTML = "점수: " + score;
            moveCat();
        }

        moveCat();
        setInterval(moveCat, 2000);
    </script>
</body>
</html>
