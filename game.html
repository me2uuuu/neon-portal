<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Chase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-background">
    <p id="score">점수: 0</p>
    <p id="neko-coins">🪙 NEKO 코인: 100</p>
    <img id="neon-cat" src="neoncat.GIF" onclick="clickCat()">

    <audio autoplay loop>
        <source src="audio/neon_singularity_bgm.mp3" type="audio/mp3">
    </audio>

    <button id="gacha-btn" onclick="goToGacha()">🎴 가챠 뽑기</button>

    <script>
        let score = 0;
        let nekoCoins = 100;
        const scoreDisplay = document.getElementById("score");
        const nekoDisplay = document.getElementById("neko-coins");

        function clickCat() {
            score++;
            nekoCoins += 2; // 고양이 클릭 시 2 코인 지급
            scoreDisplay.innerHTML = `점수: ${score}`;
            nekoDisplay.innerHTML = `🪙 NEKO 코인: ${nekoCoins}`;
        }

        function goToGacha() {
            window.localStorage.setItem("nekoCoins", nekoCoins); // 가챠 페이지로 코인 값 저장
            window.location.href = "gacha.html";
        }
    </script>
</body>
</html>
