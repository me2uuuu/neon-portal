<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON PORTAL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            background: url('https://raw.githubusercontent.com/me2uuuu/neon-portal/main/gifFile%205.GIF') no-repeat center center fixed;
            background-size: cover;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #0ff;
        }
        .title {
            font-size: 2.5em;
            text-shadow: 0 0 10px #0ff;
        }
        .sub-text {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .portal-btn {
            background: rgba(255, 0, 255, 0.6);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff00ff;
            margin: 10px;
        }
        .portal-btn:hover {
            background: #ff33ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">NEON PORTAL</h1>
        <p class="sub-text">포탈을 통해 네온 차원으로 진입하십시오.</p>
        <button class="portal-btn" onclick="location.href='game.html'">🎮 게임 시작</button>
        <button class="portal-btn" onclick="location.href='gacha.html'">🎴 가챠 뽑기</button>
    </div>
</body>
</html>
