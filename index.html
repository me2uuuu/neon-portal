<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON PORTAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🔮 NEON PORTAL</h1>
        <p class="sub-text">포탈을 통해 네온 차원으로 진입하십시오.</p>
        
        <button id="connect-wallet">😺 MetaMask 연결</button>
        <p id="nekoCoins">💰 NEKO 코인: 연결 필요</p>

        <div class="button-group">
            <button id="start-game">🎮 게임 시작</button>
            <button id="go-gacha">🎰 가챠 돌리기</button>
        </div>
    </div>

    <script>
        document.getElementById('start-game').addEventListener('click', function() {
            window.location.href = "game.html";
        });

        document.getElementById('go-gacha').addEventListener('click', function() {
            window.location.href = "gacha.html";
        });
    </script>
</body>
</html>
