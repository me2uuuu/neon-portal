<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON PORTAL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background: url('https://raw.githubusercontent.com/me2uuuu/neon-portal/main/gifFile%206.GIF') no-repeat center center fixed;
            background-size: cover;
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ffff;
        }
        .portal-btn {
            padding: 10px 20px;
            font-size: 18px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff00ff;
        }
        .portal-btn:hover {
            background: #ff33ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NEON PORTAL</h1>
        <p>포탈을 통해 네온 차원으로 진입하십시오.</p>
        <button class="portal-btn" onclick="location.href='game.html'">🚀 포탈 열기 🚀</button>
    </div>
</body>
</html>
