<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON PORTAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔮 NEON PORTAL</h1>
        <p>포탈을 통해 네온 차원으로 진입하십시오.</p>

        <button id="connectWallet">🐱 MetaMask 연결</button>
        <p id="nekoCoins">💰 NEKO 코인: 연결 필요</p>

        <button id="startGame">🎮 게임 시작</button>
        <button id="gacha">🎰 가챠 돌리기</button>
    </div>

    <script>
        document.getElementById('startGame').addEventListener('click', function() {
            window.location.href = "game.html"; // 게임 페이지 이동
        });

        document.getElementById('gacha').addEventListener('click', function() {
            window.location.href = "gacha.html"; // 가챠 페이지 이동
        });
    </script>
</body>
</html>
